name: Q1 verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Verify native certificate tooling
        run: openssl version
      - name: Build, lint, test, and reproduce independent protocol vectors
        run: python3 scripts/check_all.py
      - name: Reproduce public one-command LOCALNET validator
        run: python3 scripts/validate_public_q1.py
